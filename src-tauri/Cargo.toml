[package]
name = "SweetBeatsStudio"
version = "0.1.0"
description = "Mixing, streaming, recording, broadcasting software"
authors = ["Aaron Wilson"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sweet_beats_studio"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.0"
base64 = "0.21"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"

# Audio processing and streaming
lame = "0.1"               # MP3 encoding for recording
cpal = "0.15"              # Cross-platform audio I/O
rtrb = "0.2"               # Real-time ring buffer
rubato = "0.16.2"            # High-quality sample rate conversion
rustfft = "6.2"            # Fast Fourier Transform for spectrum analysis
sysinfo = "0.30"           # System process enumeration for application audio capture

# Recording and file management
dirs = "5.0"               # Platform-specific directory paths
regex = "1.10"             # Regular expressions for filename template processing

# Audio file decoding for media player
symphonia = { version = "0.5", features = ["aac", "mp3", "isomp4", "ogg", "flac", "wav"] }
# NOTE: depending on the codec crate directly does not register it with
# symphonia's default codec registry — .ogg/vorbis decode needs the `vorbis`
# feature enabled on `symphonia` itself. Kept pending that decision.
symphonia-codec-vorbis = "0.5"

# Database and storage
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate", "uuid"] }
sea-orm = { version = "1.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
crossbeam-channel = "0.5"  # Lock-free channels for VU processing
tauri-plugin-webdriver-automation = "0.1.3"

# Platform-specific audio system integration
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11" # Keychain, for stream passwords that have no business in the database
libc = "0.2"               # System calls for thread priority
core-foundation = "0.9"   # Core Foundation framework
coreaudio-sys = "0.2"     # Low-level Core Audio bindings

[dev-dependencies]
tempfile = "3.0"          # Temporary files for testing

